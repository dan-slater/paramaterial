site_name: Paramaterial Documentation
site_url: https://dan-slater.github.io/paramaterial/
repo_url: https://github.com/dan-slater/paramaterial
repo_name: dan-slater/paramaterial

theme:
  logo: img/pam-icon.png
  favicon: img/pam-icon.png
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - navigation.top
    - navigation.instant
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            # types live in the signatures, not repeated in the docstrings
            docstring_options:
              warn_missing_types: false
            show_source: true

nav:
  - Home: index.md
  - Example Notebooks:
      - Basic usage: https://github.com/dan-slater/paramaterial-examples/blob/main/examples/dan-msc-basic-usage/dan-msc-basic-usage-0.1.0.ipynb
      - "CS1: tensile tests across lots and temperatures": https://github.com/dan-slater/paramaterial-examples/blob/main/examples/dan-msc-case-studies/CS1/dan-msc-cs1-0.1.0.ipynb
      - "CS2: uniaxial and plane-strain tension": https://github.com/dan-slater/paramaterial-examples/blob/main/examples/dan-msc-case-studies/CS2/dan-msc-cs2-0.1.0.ipynb
      - "CS3: uniaxial compression, Zener-Hollomon": https://github.com/dan-slater/paramaterial-examples/blob/main/examples/dan-msc-case-studies/CS3/dan-msc-cs3-0.1.0.ipynb
      - "CS4: plane-strain compression, Zener-Hollomon": https://github.com/dan-slater/paramaterial-examples/blob/main/examples/dan-msc-case-studies/CS4/dan-msc-cs4-0.1.0.ipynb
  - How-To Guides:
      - guides/prepare-data.md
  - Reference:
      - reference/example.md
      - reference/preparing.md
      - reference/plug.md
      - reference/plotting.md
      - reference/processing.md
      - reference/screening.md
      - reference/aggregating.md
      - reference/modelling.md
      - reference/models.md
      - reference/receipts.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
