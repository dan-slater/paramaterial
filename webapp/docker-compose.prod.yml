# Production Docker Compose for ParaMaterial
services:
  postgres:
    image: postgres:15-alpine
    container_name: paramaterial_postgres_prod
    environment:
      POSTGRES_DB: paramaterial
      POSTGRES_USER: paramaterial_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - paramaterial_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paramaterial_user -d paramaterial"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: paramaterial_redis_prod
    volumes:
      - redis_data:/data
    networks:
      - paramaterial_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secure_redis_password}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paramaterial_api_prod
    environment:
      - DEBUG=false
      - DATABASE_URL=postgresql://paramaterial_user:${POSTGRES_PASSWORD:-secure_prod_password}@postgres:5432/paramaterial
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-jwt-secret-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,https://paramaterial.vercel.app}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - paramaterial_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: paramaterial_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - paramaterial_network
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  paramaterial_network:
    driver: bridge